services:
  traefik:
    image: traefik:latest
    container_name: sistem_inventaris_gudang_pt_rizky_badai_traefik
    command:
      - "--providers.docker=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.sig-pt-rizky-badai.com`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$ifZp4DOp$$t7BuoRRXsJiJDfvN/VNMW/"
  # backend:
  #   build: ./backend
  #   #image: composer
  #   container_name: sistem_inventaris_gudang_pt_rizky_badai_backend
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./backend:/var/www
  #     - vendor:/var/www/vendor
  #   working_dir: /var/www
  #   command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
  #   depends_on:
  #     - db
  #     - redis
  backend:
    build: ./backend
    container_name: sistem_inventaris_gudang_pt_rizky_badai_backend
    volumes:
      - ./backend:/var/www
      - vendor:/var/www/vendor
    working_dir: /var/www
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.sig-pt-rizky-badai.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=api-limit"
      - "traefik.http.routers.backend-http.rule=Host(`api.sig-pt-rizky-badai.com`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=redirect-https"
      - "traefik.http.middlewares.api-limit.ratelimit.average=20"
      - "traefik.http.middlewares.api-limit.ratelimit.burst=40"

      - "traefik.http.routers.reverb.rule=Host(`reverb.sig-pt-rizky-badai.com`)"
      - "traefik.http.routers.reverb.entrypoints=websecure"
      - "traefik.http.routers.reverb.tls=true"
      - "traefik.http.services.reverb.loadbalancer.server.port=3030"

  frontend:
    image: node:24
    container_name: sistem_inventaris_gudang_pt_rizky_badai_frontend
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-secure.rule=Host(`sig-pt-rizky-badai.com`)"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
      - "traefik.http.routers.frontend.rule=Host(`sig-pt-rizky-badai.com`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
  # frontend:
  #   image: node:24
  #   container_name: sistem_inventaris_gudang_pt_rizky_badai_frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #     - node_modules:/app/node_modules
  #   working_dir: /app
  #   command: sh -c "npm install && npm run dev -- --host"

  db:
    image: mysql:8.4
    container_name: sistem_inventaris_gudang_pt_rizky_badai_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistem_inventaris_gudang_pt_rizky_badai_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: uprakkik
      MYSQL_PASSWORD: uprakkik
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sistem_inventaris_gudang_pt_rizky_badai_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

  redis:
    image: redis:latest
    container_name: sistem_inventaris_gudang_pt_rizky_badai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: sistem_inventaris_gudang_pt_rizky_badai_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - miniodata:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: sistem_inventaris_gudang_pt_rizky_badai_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  dbdata:
  node_modules:
  vendor:
  redisdata:
  miniodata:
